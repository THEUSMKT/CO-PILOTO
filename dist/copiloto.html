<title>Copiloto de Vendas Schay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="App da Schay para responder clientes do WhatsApp, lembrar quem chamar e acompanhar o funil.">
<meta name="theme-color" content="#0E2A47">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Copiloto de Vendas Schay — visual acolhedor, letras grandes, botões fáceis de tocar.
   Cores do site dela: azul escuro, azul claro, branco e detalhes dourados.
   Tema claro de propósito (mesmo visual em qualquer celular); todas as cores são definidas aqui.
   Layout: coluna única de até 560px; faixa azul no topo; cartões grandes empilhados. */

:root {
  --azul-escuro: #0E2A47;
  --azul-escuro-2: #17406B;
  --azul: #2563A6;
  --azul-claro: #DCEBFA;
  --azul-claro-2: #EEF5FD;
  --dourado: #C9A24A;
  --dourado-escuro: #8A6A1F;
  --dourado-claro: #F6EBCD;
  --branco: #FFFFFF;
  --fundo: #F5F8FC;
  --texto: #13223A;
  --texto-2: #42536B;
  --linha: #D6E0EC;
  --verde: #15803D;
  --verde-escuro: #116A32;
  --verde-balao: #DCF8C6;
  --vermelho: #D42A1E;
  --quente: #C2410C;
  --quente-fundo: #FFEDD5;
  --morno: #9A6700;
  --morno-fundo: #FEF3C7;
  --frio: #1D5FA8;
  --frio-fundo: #DBEAFE;
  --sombra: 0 1px 2px rgba(14, 42, 71, .06), 0 8px 24px rgba(14, 42, 71, .08);
  --sombra-forte: 0 2px 4px rgba(14, 42, 71, .08), 0 14px 34px rgba(14, 42, 71, .16);
  --raio: 22px;
  --raio-pequeno: 16px;
  --fonte: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --margem-esq: max(18px, env(safe-area-inset-left, 0px));
  --margem-dir: max(18px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--fundo);
}

body {
  margin: 0;
  background: var(--fundo);
  color: var(--texto);
  font-family: var(--fonte);
  font-size: 20px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

button, input, textarea, select { font: inherit; color: inherit; }
img, svg { display: block; max-width: 100%; }
p { margin: 0; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
a { color: var(--azul); }

.escondido {
  position: fixed !important;
  left: -9999px !important;
  width: 1px; height: 1px; opacity: 0;
}

:focus-visible {
  outline: 4px solid var(--dourado);
  outline-offset: 3px;
}

#app {
  max-width: 560px;
  margin: 0 auto;
  padding-bottom: 32px;
}

.tela {
  animation: entrar .32s ease-out both;
}

@keyframes entrar {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}

.conteudo {
  padding-top: 8px;
  padding-left: var(--margem-esq);
  padding-right: var(--margem-dir);
  display: grid;
  gap: 18px;
}

/* ---------- Carregando inicial ---------- */
.carregando-inicial {
  min-height: 80vh;
  display: grid;
  place-content: center;
  gap: 16px;
  text-align: center;
  color: var(--texto-2);
}

/* ---------- Topo da tela inicial ---------- */
.topo {
  position: relative;
  background: radial-gradient(120% 140% at 85% -10%, #2A5C8F 0%, var(--azul-escuro) 55%);
  color: var(--branco);
  padding-block: 26px 74px;
  padding-left: max(22px, env(safe-area-inset-left, 0px));
  padding-right: max(22px, env(safe-area-inset-right, 0px));
  border-radius: 0 0 36px 36px;
  overflow: hidden;
}

.topo::after {
  content: "";
  position: absolute;
  left: 22px; bottom: 60px;
  width: 64px; height: 3px;
  border-radius: 3px;
  background: var(--dourado);
}

.topo-marca {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 700;
  color: var(--dourado-claro);
  letter-spacing: .02em;
}

.topo-marca svg { width: 34px; height: 34px; flex: none; }

.topo h1 {
  margin-top: 18px;
  font-size: 30px;
  font-weight: 900;
}

.topo p {
  margin-top: 6px;
  font-size: 20px;
  color: #C9DDF3;
}

.botoes-inicio {
  display: grid;
  gap: 18px;
  padding-left: var(--margem-esq);
  padding-right: var(--margem-dir);
  margin-top: -46px;
  position: relative;
}

/* ---------- Botão grande de escolha (tela inicial) ---------- */
.escolha {
  position: relative;
  display: grid;
  grid-template-columns: 68px 1fr;
  gap: 16px;
  align-items: center;
  width: 100%;
  min-height: 124px;
  padding: 20px 20px;
  border: 0;
  border-radius: var(--raio);
  background: var(--branco);
  box-shadow: var(--sombra);
  text-align: left;
  cursor: pointer;
  transition: transform .12s ease, box-shadow .2s ease;
}

.escolha:active { transform: scale(.98); box-shadow: var(--sombra-forte); }

.escolha .icone {
  width: 68px; height: 68px;
  border-radius: 20px;
  display: grid;
  place-items: center;
  font-size: 36px;
  background: var(--azul-claro-2);
  box-shadow: inset 0 0 0 2px var(--azul-claro);
}

.escolha strong {
  display: block;
  font-size: 24px;
  font-weight: 900;
  line-height: 1.15;
  color: var(--azul-escuro);
}

.escolha span.sub {
  display: block;
  margin-top: 6px;
  font-size: 18px;
  color: var(--texto-2);
  line-height: 1.35;
}

.escolha.principal {
  background: linear-gradient(160deg, #1B4C7E 0%, var(--azul-escuro) 70%);
  box-shadow: var(--sombra-forte), inset 0 0 0 2px rgba(201, 162, 74, .55);
}

.escolha.principal strong { color: var(--branco); }
.escolha.principal span.sub { color: #CFE0F2; }
.escolha.principal .icone { background: rgba(255, 255, 255, .1); box-shadow: inset 0 0 0 2px rgba(201, 162, 74, .7); }

.escolha.discreta { background: var(--azul-claro-2); box-shadow: inset 0 0 0 2px var(--azul-claro); }
.escolha.discreta .icone { background: var(--branco); }

.bolinha {
  position: absolute;
  top: -8px; right: -6px;
  min-width: 38px; height: 38px;
  padding: 0 10px;
  border-radius: 999px;
  background: var(--vermelho);
  color: var(--branco);
  font-size: 20px;
  font-weight: 900;
  display: grid;
  place-items: center;
  border: 3px solid var(--fundo);
  animation: pulsar 2.4s ease-in-out infinite;
}

@keyframes pulsar {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

.rodape-inicio {
  margin-top: 26px;
  padding-left: var(--margem-esq);
  padding-right: var(--margem-dir);
  text-align: center;
  font-size: 18px;
  color: var(--texto-2);
}

/* ---------- Barra de cima (Voltar + passo) ---------- */
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--fundo);
}

.barra {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(245, 248, 252, .94);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.voltar {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 60px;
  padding: 0 20px 0 14px;
  border: 2px solid var(--linha);
  border-radius: 999px;
  background: var(--branco);
  font-size: 20px;
  font-weight: 800;
  color: var(--azul-escuro);
  cursor: pointer;
}

.voltar:active { background: var(--azul-claro-2); }
.voltar span[aria-hidden] { font-size: 26px; line-height: 1; }

.passos {
  display: grid;
  justify-items: end;
  gap: 6px;
  font-size: 18px;
  font-weight: 800;
  color: var(--texto-2);
}

.passos .trilho { display: flex; gap: 6px; }
.passos .trilho i {
  width: 30px; height: 8px;
  border-radius: 99px;
  background: var(--linha);
}
.passos .trilho i.feito { background: var(--dourado); }

/* ---------- Títulos ---------- */
.titulo h1 {
  font-size: 30px;
  font-weight: 900;
  color: var(--azul-escuro);
}

.titulo p {
  margin-top: 8px;
  font-size: 20px;
  color: var(--texto-2);
}

/* ---------- Botões ---------- */
.botao {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  min-height: 68px;
  padding: 14px 22px;
  border: 0;
  border-radius: var(--raio-pequeno);
  font-size: 22px;
  font-weight: 900;
  line-height: 1.2;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  transition: transform .12s ease, filter .2s ease, background .2s ease;
}

.botao:active { transform: scale(.98); }
.botao[disabled] { opacity: .55; cursor: default; }

.botao.forte {
  background: var(--azul-escuro);
  color: var(--branco);
  box-shadow: 0 8px 20px rgba(14, 42, 71, .25), inset 0 -3px 0 rgba(0, 0, 0, .18);
}

.botao.whats {
  min-height: 80px;
  background: var(--verde);
  color: var(--branco);
  font-size: 23px;
  letter-spacing: .01em;
  box-shadow: 0 10px 22px rgba(21, 128, 61, .3), inset 0 -4px 0 rgba(0, 0, 0, .18);
}

.botao.whats:active { background: var(--verde-escuro); }
.botao.whats svg { width: 34px; height: 34px; flex: none; }

.botao.claro {
  background: var(--branco);
  color: var(--azul-escuro);
  box-shadow: inset 0 0 0 2px var(--linha);
}

.botao.dourado {
  background: var(--dourado-claro);
  color: #5B4510;
  box-shadow: inset 0 0 0 2px #E5D3A4;
}

.botao.gigante {
  min-height: 132px;
  flex-direction: column;
  gap: 8px;
  border-radius: var(--raio);
  font-size: 24px;
}

.botao.gigante .emoji { font-size: 44px; line-height: 1; }

.botao.destaque { animation: chamar 1.6s ease-in-out 2; }
@keyframes chamar {
  0%, 100% { box-shadow: 0 8px 20px rgba(14, 42, 71, .25); }
  50% { box-shadow: 0 0 0 8px rgba(201, 162, 74, .45); }
}

.link {
  display: block;
  width: 100%;
  min-height: 60px;
  padding: 12px;
  border: 0;
  background: none;
  font-size: 20px;
  font-weight: 800;
  color: var(--azul);
  text-decoration: underline;
  text-underline-offset: 4px;
  text-align: center;
  cursor: pointer;
}

.link.pequeno { font-size: 18px; font-weight: 700; }

/* ---------- Cartões ---------- */
.cartao {
  background: var(--branco);
  border-radius: var(--raio);
  box-shadow: var(--sombra);
  padding: 20px;
}

.cartao h2 {
  font-size: 22px;
  font-weight: 900;
  color: var(--azul-escuro);
}

.rotulo {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--dourado-escuro);
}

/* ---------- Passo 1: foto ---------- */
.ilustracao {
  background: linear-gradient(180deg, var(--azul-claro-2), var(--branco));
  border-radius: var(--raio);
  padding: 18px 18px 14px;
  box-shadow: inset 0 0 0 2px var(--azul-claro);
}

.ilustracao svg { margin: 0 auto; width: 100%; max-width: 360px; height: auto; }

.ilustracao p {
  margin-top: 10px;
  text-align: center;
  font-size: 19px;
  color: var(--texto-2);
}

.campo {
  width: 100%;
  min-height: 64px;
  padding: 16px 18px;
  border: 2px solid var(--linha);
  border-radius: var(--raio-pequeno);
  background: var(--branco);
  font-size: 20px;
}

textarea.campo { min-height: 220px; resize: vertical; line-height: 1.4; }
.campo:focus { border-color: var(--azul); outline: none; box-shadow: 0 0 0 4px rgba(37, 99, 166, .18); }

.fotos-escolhidas {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: var(--raio-pequeno);
  background: #DCFCE7;
  color: #14532D;
  font-size: 19px;
  font-weight: 800;
}

.fotos-escolhidas img {
  width: 40px; height: 56px;
  object-fit: cover;
  object-position: top;
  border-radius: 6px;
  box-shadow: var(--sombra);
}

/* ---------- Passo 2: imóveis ---------- */
.lista-imoveis { display: grid; gap: 16px; }

.imovel {
  display: grid;
  grid-template-columns: 112px 1fr;
  gap: 14px;
  align-items: center;
  width: 100%;
  min-height: 112px;
  padding: 12px;
  border: 0;
  border-radius: var(--raio);
  background: var(--branco);
  box-shadow: var(--sombra);
  text-align: left;
  cursor: pointer;
  transition: transform .12s ease;
}

.imovel:active { transform: scale(.98); }

.imovel img {
  width: 112px; height: 88px;
  object-fit: cover;
  border-radius: 14px;
  background: var(--azul-claro-2);
}

.imovel strong { display: block; font-size: 21px; font-weight: 900; color: var(--azul-escuro); line-height: 1.2; }
.imovel span { display: block; margin-top: 4px; font-size: 18px; color: var(--texto-2); }

.imovel .etiqueta {
  display: inline-block;
  width: auto;
  margin-bottom: 6px;
  padding: 2px 10px;
  border-radius: 99px;
  background: var(--dourado-claro);
  color: #6B5113;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: .04em;
}

.imovel.pular {
  grid-template-columns: 112px 1fr;
  background: var(--azul-claro-2);
  box-shadow: inset 0 0 0 2px var(--azul-claro);
}

.imovel.pular .icone-pular {
  width: 112px; height: 88px;
  display: grid;
  place-items: center;
  font-size: 44px;
  border-radius: 14px;
  background: var(--branco);
}

/* ---------- Pensando ---------- */
.pensando {
  min-height: 60vh;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 22px;
  text-align: center;
  padding: 0 24px;
}

.pensando h1 { font-size: 28px; font-weight: 900; color: var(--azul-escuro); }
.pensando p { font-size: 20px; color: var(--texto-2); min-height: 2.9em; }

.balao-digitando {
  display: inline-flex;
  gap: 10px;
  padding: 22px 28px;
  border-radius: 28px 28px 28px 8px;
  background: var(--branco);
  box-shadow: var(--sombra-forte);
}

.pontinhos { display: inline-flex; gap: 10px; justify-content: center; }
.pontinhos span, .balao-digitando span {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--dourado);
  animation: pulo 1.2s ease-in-out infinite;
}
.pontinhos span:nth-child(2), .balao-digitando span:nth-child(2) { animation-delay: .15s; background: var(--azul); }
.pontinhos span:nth-child(3), .balao-digitando span:nth-child(3) { animation-delay: .3s; background: var(--azul-escuro); }

@keyframes pulo {
  0%, 60%, 100% { transform: translateY(0); opacity: .7; }
  30% { transform: translateY(-12px); opacity: 1; }
}

/* ---------- Resultado ---------- */
.selo {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 16px;
  align-items: center;
  padding: 18px 20px;
  border-radius: var(--raio);
}

.selo .emoji { font-size: 52px; line-height: 1; }
.selo strong { display: block; font-size: 26px; font-weight: 900; line-height: 1.1; }
.selo p { margin-top: 6px; font-size: 19px; line-height: 1.35; color: var(--texto); }

.selo.quente { background: var(--quente-fundo); box-shadow: inset 0 0 0 2px #FDBA74; }
.selo.quente strong { color: var(--quente); }
.selo.morno { background: var(--morno-fundo); box-shadow: inset 0 0 0 2px #FCD34D; }
.selo.morno strong { color: var(--morno); }
.selo.frio { background: var(--frio-fundo); box-shadow: inset 0 0 0 2px #93C5FD; }
.selo.frio strong { color: var(--frio); }

.responda h2 {
  font-size: 24px;
  font-weight: 900;
  color: var(--azul-escuro);
  margin-bottom: 12px;
}

.conversa-fundo {
  padding: 18px 14px;
  border-radius: var(--raio);
  background-color: #EFE7DD;
  background-image: radial-gradient(rgba(14, 42, 71, .06) 1.2px, transparent 1.2px);
  background-size: 18px 18px;
}

.balao {
  position: relative;
  margin-left: auto;
  max-width: 94%;
  padding: 14px 16px 26px;
  border-radius: 18px 4px 18px 18px;
  background: var(--verde-balao);
  box-shadow: 0 1px 1.5px rgba(0, 0, 0, .15);
  font-size: 20px;
  line-height: 1.45;
  white-space: pre-wrap;
  word-wrap: break-word;
}

.balao::after {
  content: "";
  position: absolute;
  top: 0; right: -9px;
  border-width: 0 0 12px 12px;
  border-style: solid;
  border-color: transparent transparent transparent var(--verde-balao);
}

.balao .hora {
  position: absolute;
  right: 12px; bottom: 6px;
  font-size: 14px;
  color: #5E7466;
}

.balao.audio { background: var(--branco); margin-left: 0; border-radius: 4px 18px 18px 18px; }
.balao.audio::after { right: auto; left: -9px; border-width: 0 12px 12px 0; border-color: transparent var(--branco) transparent transparent; }

.titulo-audio {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 10px;
  font-size: 20px; font-weight: 900; color: var(--azul-escuro);
}

.pilha { display: grid; gap: 12px; }

.lembrete {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 14px;
  align-items: start;
}

.lembrete .emoji { font-size: 36px; line-height: 1; }
.lembrete strong { display: block; font-size: 21px; font-weight: 900; color: var(--azul-escuro); }
.lembrete p { margin-top: 4px; font-size: 19px; color: var(--texto-2); }

.ok-verde {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 10px;
  padding: 4px 12px;
  border-radius: 99px;
  background: #DCFCE7;
  color: #14532D;
  font-size: 18px;
  font-weight: 800;
}

.dica {
  padding: 18px 20px;
  border-radius: var(--raio);
  background: var(--dourado-claro);
  box-shadow: inset 4px 0 0 var(--dourado);
}

.dica strong { display: block; font-size: 20px; font-weight: 900; color: #5B4510; }
.dica p { margin-top: 6px; font-size: 19px; color: #3D3010; }

.objetivo { font-size: 19px; color: var(--texto-2); }

.nota-instalar {
  padding: 16px 18px;
  border-radius: var(--raio);
  background: var(--dourado-claro);
  box-shadow: inset 4px 0 0 var(--dourado);
  font-size: 19px;
  color: #3D3010;
}
.objetivo b { color: var(--azul-escuro); }

/* ---------- Quem chamar hoje ---------- */
.lista-chamar { display: grid; gap: 16px; }

.pessoa {
  display: grid;
  gap: 14px;
  padding: 18px;
  border-radius: var(--raio);
  background: var(--branco);
  box-shadow: var(--sombra);
}

.pessoa-topo { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; }

.avatar {
  width: 56px; height: 56px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 24px;
  font-weight: 900;
  color: var(--azul-escuro);
  background: linear-gradient(135deg, var(--azul-claro), var(--dourado-claro));
}

.pessoa h2 { font-size: 24px; font-weight: 900; color: var(--azul-escuro); line-height: 1.15; }
.pessoa .imovel-nome { margin-top: 2px; font-size: 18px; color: var(--texto-2); }

.situacao {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 19px;
  font-weight: 800;
  line-height: 1.3;
}

.situacao.urgente { background: #FEE2E2; color: #8F1D14; }

<script type="application/json" id="playbook">"# Cérebro do Copiloto de Vendas Schay\n\nVocê é um mentor de vendas imobiliárias que fala com a Schay em português do Brasil, de um jeito direto e acolhedor. A Schay é corretora na Imobiliária Innovar, em São Leopoldo/RS. Ela veio do varejo de roupas e está começando em imóveis: sabe atender gente, mas ainda tem dificuldade de conduzir a conversa, persuadir e chamar o cliente de novo quando ele some. Ela é iniciante: explique o porquê em 1 linha, sem jargão.\n\nOs clientes chegam por anúncios no Instagram/Facebook e caem direto no WhatsApp dela. Muitos são frios ou só curiosos. A Schay manda um print (ou cola o texto) da conversa, e você devolve a próxima mensagem pronta para ela copiar e enviar. O app não envia nada sozinho: quem envia é ela.\n\n## Objetivo\n\nNão é vender o imóvel por mensagem. É avançar um degrau por vez:\n\nresposta rápida → vínculo → entender a necessidade → qualificar → apresentar o imóvel ligado ao que o cliente disse → marcar visita (ou ligação/áudio) → proposta.\n\nEm cada resposta, descubra em que degrau a conversa está e sugira a mensagem que sobe só o próximo degrau.\n\n## Como ler a conversa\n\n- No print do WhatsApp, os balões da **direita** (verdes) são da Schay. Os balões da **esquerda** (brancos) são do cliente.\n- O nome ou o telefone que aparece no **topo** do print é o do cliente. Se aparecer só o número, use-o como telefone. Nunca invente nome nem telefone: se não estiver visível, devolva `null`.\n- A mensagem mais recente fica embaixo. Responda sempre à última coisa que o cliente disse.\n- Se a última mensagem for da Schay e o cliente não respondeu, o cliente \"sumiu\": sugira uma mensagem de retomada, não repita o que ela já mandou.\n- Mensagens automáticas de anúncio (\"Olá! Tenho interesse e queria mais informações, por favor.\") contam como primeiro contato.\n\n## Princípios\n\n1. **Rapidez e nome.** Responder em até 5 minutos, chamando pelo primeiro nome (se souber). A 1ª mensagem é curta: agradece o contato e faz UMA pergunta aberta sobre o que a pessoa procura.\n2. **Perguntar antes de falar do imóvel.** Descobrir aos poucos: motivo da compra, prazo, faixa de valor, entrada/FGTS, financiamento, quem decide junto. No máximo 1 ou 2 perguntas por mensagem.\n3. **Conectar, não listar.** Ligue o imóvel ao que o cliente contou (\"você falou que trabalha em Novo Hamburgo: daqui são 15 minutos pela BR\"), em vez de despejar características.\n4. **Toda mensagem termina andando pra frente:** uma pergunta ou um convite. Para visita, ofereça 2 opções de horário (\"sábado às 10h ou domingo às 15h?\").\n5. **Tom de WhatsApp:** frases curtas, natural, no máximo 1 emoji, sem textão (ideal até 3 linhas), sem cara de robô ou de propaganda. Nada de \"Prezado\", \"Olá, tudo bem? Espero que sim!\", CAIXA ALTA ou listas.\n6. **Cliente frio ou curioso:** não insistir. Faça uma pergunta leve que separe curioso de interessado (\"é pra morar ou pra investir?\", \"tá procurando pra agora ou mais pra frente?\").\n7. **Objeções:** acolher → perguntar → reposicionar. Respostas curtas (veja abaixo).\n8. **Cliente que some:** retomar em D+1, D+3, D+7 e D+14, cada vez de um jeito diferente: novidade, conteúdo útil, pergunta leve e, por fim, despedida educada. Nunca \"oi, viu minha mensagem?\" nem cobrança.\n9. **Depois da visita:** perguntar a impressão em até 2 horas, tratar a objeção real e propor o próximo passo.\n\n## Objeções mais comuns (modelos curtos para adaptar)\n\n- **\"Só estou olhando.\"** → \"Imagina, fica à vontade! Pra eu te mandar só o que faz sentido: você tá pensando em morar ou investir?\"\n- **\"Está caro.\"** → \"Entendo, é um valor importante. Me conta: qual faixa ficaria confortável pra você? Assim eu vejo o que encaixa melhor.\"\n- **\"Vou falar com meu marido/esposa.\"** → \"Claro, decisão de casa é a dois mesmo 😊 O que você acha que ele vai querer saber? Se quiser, combino uma visita com vocês dois: sábado de manhã ou domingo à tarde?\"\n- **\"Vou ver outras opções.\"** → \"Faz bem em comparar! O que é mais importante pra você na escolha? Se eu tiver algo mais perto disso, te mostro.\"\n- **\"Não tenho entrada.\"** → \"Entendi. Às vezes dá pra usar o FGTS ou financiar uma parte maior, depende de cada caso. Quer que eu veja uma simulação sem compromisso?\"\n- **\"Depois eu te falo.\"** → \"Combinado! Pra eu não te incomodar à toa: posso te chamar na quinta pra saber o que achou?\"\n- **\"Faz desconto?\"** → \"Posso levar sua proposta ao proprietário, sim. Não consigo prometer, mas apresento com todo cuidado. Qual valor você tem em mente?\"\n\n## Retomada (cliente sumiu)\n\nUse o número de tentativas já feitas para escolher o tipo de mensagem:\n\n- **D+1 (1ª retomada):** leve e útil. Traga um detalhe novo do imóvel ou uma pergunta fácil de responder.\n- **D+3 (2ª):** conteúdo útil (ex.: como funciona usar o FGTS, o que olhar numa visita, a rotina do bairro), sem pressão.\n- **D+7 (3ª):** pergunta leve que dê saída fácil (\"ainda faz sentido eu te mandar opções, ou mudou o momento?\").\n- **D+14 (4ª e última):** despedida educada, deixando a porta aberta (\"vou parar de te chamar pra não incomodar; quando quiser, é só me chamar aqui\").\n\nNunca culpe o cliente pelo silêncio e nunca use urgência falsa para \"acordar\" a conversa.\n\n## Honestidade (inegociável)\n\n- Use **só** dados que estejam na lista de imóveis abaixo ou na própria conversa. Faltou informação (valor, metragem, condições, documentação, financiamento, aceita permuta, vaga, condomínio)? **Não invente.** A resposta deve dizer algo como \"vou confirmar e já te retorno\".\n- Sem urgência ou escassez falsa (\"últimas unidades\", \"só hoje\") e sem prometer aprovação de financiamento, desconto ou prazo.\n- Persuasão aqui é clareza, empatia e facilitar o próximo passo. Sem manipulação, sem pressão.\n- Se o cliente pedir para parar ou disser que não quer mais contato, a resposta deve encerrar com educação, sem tentar convencer, `pediu_para_parar` = true e `followup.precisa` = false.\n- Se a conversa não tiver nada a ver com imóveis, responda com educação e sem inventar.\n\n## Como classificar o cliente\n\n- **frio:** curioso, respostas curtas, só pergunta preço, sem prazo nem motivo claro.\n- **morno:** tem interesse real, mas ainda sem prazo, valor ou decisão definidos.\n- **quente:** tem motivo e prazo, fala de valor/entrada/financiamento, pede visita ou faz proposta.\n\n## Etapa (o app organiza o cliente sozinho com base nisso)\n\n- `novo`: só o primeiro contato, a Schay ainda não conversou de verdade com ele.\n- `conversando`: já existe troca de mensagens (o cliente respondeu a Schay).\n- `visita_marcada`: dia e horário de visita combinados na conversa.\n- `proposta`: o cliente fez ou pediu para fazer uma proposta/valor.\n- `vendido`: negócio fechado.\n- `perdido`: o cliente desistiu claramente ou pediu para parar.\n\n## Lembrete se o cliente não responder\n\n- `dias`: em quantos dias chamar de novo (0 = hoje mais tarde, 1 = amanhã, 2 = depois de amanhã...). Normalmente 1. Depois de visita, 0 (perguntar no mesmo dia).\n- `hora`: \"HH:MM\", em horário comercial (entre 09:00 e 19:00). Prefira 10:00, 12:30 ou 18:30. Evite domingo antes das 10h.\n- `quando`: o mesmo, em palavras simples (\"amanhã às 10h\").\n- `mensagem`: a mensagem pronta para mandar se ele não responder, já no estilo da retomada certa.\n- `precisa` = false só quando não faz sentido chamar de novo (pediu para parar, venda fechada, desistiu de vez).\n\n## Áudio\n\nQuando ajudar a criar vínculo (cliente morno/quente, conversa já andando) ou para explicar algo que fica longo por escrito (ex.: financiamento), a 2ª opção de resposta pode ser um **roteiro de áudio** (`tipo` = \"audio\"): fala natural, de até 20 segundos (no máximo 50 palavras), como a Schay falaria, terminando com pergunta ou convite. Não sugira áudio no primeiro contato com cliente frio.\n\n## Formato da resposta (JSON)\n\nQuem lê os campos `leitura`, `proximo_passo`, `followup.quando` e `por_que` é a Schay, no celular. Escreva para ela (\"você\"), em português simples e carinhoso, frases curtas, **sem palavras técnicas ou em inglês**: nada de \"lead\", \"follow-up\", \"funil\", \"temperatura\", \"rapport\", \"gatilho\", \"CTA\", \"qualificar\".\n\n- `cliente.nome` / `cliente.telefone`: como aparecem no print/texto, ou `null`. Telefone só com números e DDD, se visível.\n- `imovel_id`: o `id` do imóvel de que a conversa trata (o informado pela Schay ou o que a conversa deixa claro), ou `null`.\n- `momento`: `primeiro_contato`, `conversando`, `sumiu` ou `pos_visita`.\n- `etapa`: veja acima.\n- `temperatura`: `frio`, `morno` ou `quente`.\n- `leitura`: 1 frase (até 20 palavras) dizendo o que o cliente quer de verdade. Ex.: \"Quer sair do aluguel até o meio do ano e está com medo de não ter entrada.\"\n- `respostas`: exatamente 2 opções, diferentes entre si. A 1ª é sempre `tipo` = \"texto\" e é a melhor opção. A 2ª pode ser outro texto (outro caminho) ou um roteiro de áudio. Escritas na voz da Schay, prontas para colar no WhatsApp, sem aspas, sem assinatura, sem colchetes ou campos para preencher. Use o primeiro nome do cliente só se souber.\n- `proximo_passo`: o objetivo agora, em até 10 palavras (ex.: \"Descobrir se é pra morar ou investir\").\n- `followup`: veja \"Lembrete\".\n- `por_que`: 1 frase (até 20 palavras) ensinando a técnica por trás da resposta, para a Schay aprender.\n- `resumo`: 1 frase curta para o app lembrar quem é esse cliente (o que procura, prazo, condição). Sem dados sensíveis (sem CPF, renda exata, endereço).\n- `primeira_mensagem`: data e hora da primeira mensagem do cliente que aparece na conversa. `data` em \"AAAA-MM-DD\" (use a etiqueta de dia do WhatsApp: \"HOJE\", \"ONTEM\", dia da semana ou data, e o \"Agora\" da situação para descobrir a data certa) e `hora` em \"HH:MM\". Use `null` no que não estiver visível. Nunca chute.\n- `pediu_para_parar`: true se o cliente pediu para não ser mais contatado.\n\n## Avaliação do atendimento (só o gestor vê)\n\nAlém da resposta para a Schay, avalie como o atendimento foi conduzido **até aqui**, para o gestor descobrir se os leads travam por causa do atendimento, do perfil do lead, do preço ou do imóvel. A Schay não vê esta parte. Seja justo e objetivo:\n\n- Avalie **só o que está visível** na conversa. Se não dá para saber (horários cortados, começo da conversa fora do print), não marque a falha.\n- Não cobre o que ainda não era hora (ex.: convidar para visita logo na primeira mensagem não é obrigatório).\n- Se a Schay ainda não escreveu nada na conversa, `nota_atendimento` = `null`, `falhas` e `acertos` vazios e `causa_principal` = \"ainda_em_andamento\".\n\nCampos de `avaliacao` (no modo de retomada sem print, `avaliacao` = `null`):\n\n- `nota_atendimento`: 0 a 10, de acordo com os princípios deste playbook (rapidez, perguntas antes de falar do imóvel, conectar o imóvel ao cliente, terminar com pergunta ou convite, visita com 2 horários, tratar objeção, retomar quem sumiu).\n- `minutos_ate_primeira_resposta`: minutos entre a primeira mensagem do cliente e a primeira resposta da Schay, pelos horários do print. `null` se não der para calcular.\n- `onde_travou`: o ponto em que a conversa parou de avançar: \"nao_travou\", \"primeira_resposta\", \"entender_necessidade\", \"apresentacao_imovel\", \"convite_visita\", \"objecao\", \"retomada\" (o cliente sumiu e faltou retomar direito) ou \"pos_visita\".\n- `causa_principal`: o que mais pesou para travar: \"atendimento\" (dava para conduzir melhor), \"perfil_do_lead\" (curioso, frio, sem intenção real), \"preco_ou_condicoes\", \"imovel\" (não atende ao que o cliente procura) ou \"ainda_em_andamento\".\n- `falhas`: lista com os códigos que aparecem na conversa: \"demorou_para_responder\", \"nao_fez_perguntas\", \"nao_respondeu_o_que_perguntou\", \"listou_sem_conectar\", \"nao_convidou_visita\", \"convite_sem_horarios\", \"nao_tratou_objecao\", \"mensagem_longa_ou_robotica\", \"terminou_sem_proximo_passo\", \"nao_retomou\", \"informacao_errada_ou_promessa\".\n- `acertos`: lista com os códigos: \"respondeu_rapido\", \"fez_boas_perguntas\", \"conectou_imovel_ao_cliente\", \"convidou_visita_com_horarios\", \"tratou_objecao_bem\", \"tom_acolhedor\", \"retomou_contato\".\n- `motivo_esfriou`: o motivo mais provável de o cliente ter esfriado: \"preco\", \"entrada_financiamento\", \"localizacao\", \"caracteristicas\", \"so_curiosidade\", \"demora_ou_falha_atendimento\", \"sem_motivo_claro\" ou \"nao_esfriou\".\n- `comentario`: 1 ou 2 frases para o gestor dizendo o que aconteceu nesta conversa e o que teria ajudado. Sem julgar a pessoa, só a condução.\n\n## Exemplo\n\nConversa: cliente \"Ana\" mandou \"Oi, quanto custa o apartamento do anúncio?\" e nada mais.\n\n- leitura: \"Quer saber o preço; ainda não sabemos se procura pra morar ou investir.\"\n- respostas[0] (preço está na lista): \"Oi, Ana! Obrigada pelo contato 😊 Ele está R$ 289 mil. Pra eu te ajudar melhor: você procura pra morar ou pra investir?\"\n- respostas[0] (preço NÃO está na lista): \"Oi, Ana! Obrigada pelo contato 😊 Vou confirmar o valor atualizado e já te passo. Enquanto isso, me conta: você procura pra morar ou pra investir?\"\n- proximo_passo: \"Descobrir o motivo da compra\"\n- por_que: \"Responder o preço sem enrolar e devolver uma pergunta mantém a conversa viva e mostra o que ela busca.\"\n\nResponda sempre o que o cliente perguntou (se o dado existir) antes de fazer a sua pergunta: esconder o preço afasta o cliente frio."</script>
<script>
"use strict";
(() => {
// ================================================================
// Cérebro: monta o pedido para o Claude e confere a resposta.
// O texto das regras vem do playbook.md (embutido na página pelo scripts/montar.mjs).
// A IA roda pela conta Claude de quem está usando o app (capability "sample").
// ================================================================
const MODELO = "claude-sonnet-5-5";
const PLAYBOOK = (() => {
  try {
    return JSON.parse(document.getElementById("playbook").textContent);
  } catch {
    return "";
  }
})();

const FORMATO_JSON = `{
  "cliente": { "nome": "nome como aparece, ou null", "telefone": "só números com DDD, ou null" },
  "imovel_id": "id do imóvel da lista, ou null",
  "momento": "primeiro_contato | conversando | sumiu | pos_visita",
  "etapa": "novo | conversando | visita_marcada | proposta | vendido | perdido",
  "temperatura": "frio | morno | quente",
  "leitura": "1 frase: o que o cliente quer de verdade",
  "respostas": [
    { "texto": "melhor resposta, pronta para colar no WhatsApp", "tipo": "texto" },

  ],
  "proximo_passo": "objetivo agora, até 10 palavras",
  "followup": { "precisa": true, "dias": 1, "hora": "10:00", "quando": "amanhã às 10h", "mensagem": "mensagem pronta se ele não responder" },
  "por_que": "1 frase ensinando a técnica",
  "resumo": "1 frase para lembrar quem é esse cliente",
  "primeira_mensagem": { "data": "AAAA-MM-DD ou null", "hora": "HH:MM ou null" },
  "pediu_para_parar": false,
  "avaliacao": {
    "nota_atendimento": 7,
    "minutos_ate_primeira_resposta": 15,
    "onde_travou": "nao_travou | primeira_resposta | entender_necessidade | apresentacao_imovel | convite_visita | objecao | retomada | pos_visita",
    "causa_principal": "atendimento | perfil_do_lead | preco_ou_condicoes | imovel | ainda_em_andamento",
    "falhas": ["códigos da lista de falhas"],
    "acertos": ["códigos da lista de acertos"],
    "motivo_esfriou": "preco | entrada_financiamento | localizacao | caracteristicas | so_curiosidade | demora_ou_falha_atendimento | sem_motivo_claro | nao_esfriou",
    "comentario": "1 ou 2 frases para o gestor"
  }
}
(No modo de retomada sem print, "avaliacao" é null.)`;

// Códigos aceitos na avaliação do atendimento (o painel do gestor traduz cada um).
const AVALIACAO = {
  onde_travou: ["nao_travou", "primeira_resposta", "entender_necessidade", "apresentacao_imovel", "convite_visita", "objecao", "retomada", "pos_visita"],
  causa_principal: ["atendimento", "perfil_do_lead", "preco_ou_condicoes", "imovel", "ainda_em_andamento"],
  falhas: ["demorou_para_responder", "nao_fez_perguntas", "nao_respondeu_o_que_perguntou", "listou_sem_conectar", "nao_convidou_visita", "convite_sem_horarios", "nao_tratou_objecao", "mensagem_longa_ou_robotica", "terminou_sem_proximo_passo", "nao_retomou", "informacao_errada_ou_promessa"],
  acertos: ["respondeu_rapido", "fez_boas_perguntas", "conectou_imovel_ao_cliente", "convidou_visita_com_horarios", "tratou_objecao_bem", "tom_acolhedor", "retomou_contato"],
  motivo_esfriou: ["preco", "entrada_financiamento", "localizacao", "caracteristicas", "so_curiosidade", "demora_ou_falha_atendimento", "sem_motivo_claro", "nao_esfriou"],
};

const DATA_HORA = new Intl.DateTimeFormat("pt-BR", {
  timeZone: "America/Sao_Paulo",
  weekday: "long",
  day: "2-digit",
  month: "2-digit",
  year: "numeric",
  hour: "2-digit",
  minute: "2-digit",
});

/** Lista de imóveis para o prompt (sem a foto, que é pesada e não ajuda a IA). */
function catalogoParaIA(lista) {
  return lista.map(({ foto, atualizadoEm, ...resto }) => resto);
}

function descreverCliente(c) {
  const linhas = ["## O que o app já sabe deste cliente"];
  if (c.nome) linhas.push(`- Nome: ${c.nome}`);
  if (c.resumo) linhas.push(`- Resumo: ${c.resumo}`);
  if (c.etapa) linhas.push(`- Etapa: ${c.etapa}`);
  if (c.temperatura) linhas.push(`- Como estava: ${c.temperatura}`);
  if (Number.isFinite(c.diasSemContato)) linhas.push(`- Dias sem conversar: ${c.diasSemContato}`);
  if (Number.isFinite(c.tentativas)) linhas.push(`- Mensagens de retomada já enviadas sem resposta: ${c.tentativas}`);
  if (c.visitaEm) linhas.push(`- Visita marcada para: ${c.visitaEm}`);
  if (c.mensagemPlanejada) linhas.push(`- Mensagem de retomada sugerida antes: "${c.mensagemPlanejada}"`);
  return linhas.join("\n");
}

/** O pedido inteiro, em texto: regras + imóveis + situação + conversa + formato da resposta. */
function montarPedido(entrada, listaImoveis) {
  const catalogo = catalogoParaIA(listaImoveis);
  const temExemplo = catalogo.some((i) => i.exemplo);
  const imovel = entrada.imovelId ? listaImoveis.find((i) => i.id === entrada.imovelId) : null;
  const partes = [
    "Você vai ajudar uma corretora de imóveis seguindo as regras abaixo.",
    "",
    "<regras>",
    PLAYBOOK,
    "</regras>",
    "",
    "## Imóveis disponíveis",
    !catalogo.length
      ? ""
      : temExemplo
        ? 'Imóveis com "exemplo": true são de demonstração (a imobiliária ainda vai trocar pelos reais). Para eles, use os valores que aparecem depois de "ex.:" como se fossem os dados do imóvel, e nunca cite o texto "EXEMPLO - SUBSTITUIR" para o cliente.'
        : "Use apenas estes dados. O que não estiver aqui, a Schay precisa confirmar.",
    catalogo.length ? "```json\n" + JSON.stringify(catalogo, null, 1) + "\n```" : "Nenhum imóvel cadastrado ainda: não cite dados de imóvel; sugira confirmar.",
    "",
    "## Situação",
    `- Agora: ${DATA_HORA.format(new Date())} (horário de Brasília)`,
    `- Imóvel indicado pela Schay: ${imovel ? `${imovel.id} (${imovel.titulo})` : "não informado"}`,
  ];
  if (entrada.cliente) partes.push("", descreverCliente(entrada.cliente));

  if (entrada.modo === "retomar") {
    const posVisita = entrada.cliente?.motivo === "pos_visita";
    partes.push(
      "",
      "## O que fazer",
      posVisita
        ? "A Schay quer saber o que o cliente achou da visita. Escreva a mensagem de pós-visita (momento = pos_visita): perguntar a impressão, abrir espaço para a objeção real e propor o próximo passo."
        : "O cliente parou de responder. Escreva a mensagem de retomada certa para o número de tentativas já feitas (0 = D+1, 1 = D+3, 2 = D+7, 3 ou mais = D+14 despedida). momento = sumiu.",
      "Não há print desta vez. Use só o que o app sabe do cliente e os dados do imóvel; não invente fatos sobre a conversa.",
    );
  } else {
    if (entrada.texto?.trim()) partes.push("", "## Conversa colada pela Schay (texto)", entrada.texto.trim().slice(0, 20000));
    if (entrada.imagens?.length) partes.push("", `## Conversa: ${entrada.imagens.length} print(s) do WhatsApp nas imagens anexadas, em ordem.`);
    partes.push("", "## O que fazer", "Leia a conversa e sugira a próxima mensagem da Schay para este cliente.");
  }
  partes.push(
    "",
    "## Formato da resposta",
    "Responda SOMENTE com um objeto JSON neste formato, sem nenhum texto antes ou depois:",
    FORMATO_JSON,
  );
  return partes.join("\n");
}

const limitar = (s, max) => (typeof s === "string" ? s.trim().slice(0, max) : "");
const HORA_VALIDA = /^([01]\d|2[0-3]):[0-5]\d$/;

/** Confere e arruma o JSON devolvido, para o app nunca quebrar por um campo estranho. */
function normalizarResultado(bruto, idsImoveis) {
  const respostas = (Array.isArray(bruto?.respostas) ? bruto.respostas : [])
    .map((r) => ({ texto: limitar(r?.texto, 1200), tipo: r?.tipo === "audio" ? "audio" : "texto" }))
    .filter((r) => r.texto)
    .slice(0, 2);
  if (!respostas.length) {
    const erro = new Error("sem respostas");
    erro.code = "invalid_json";
    throw erro;
  }
  if (respostas[0].tipo === "audio") {
    const i = respostas.findIndex((r) => r.tipo === "texto");
    if (i > 0) respostas.unshift(...respostas.splice(i, 1));
    else respostas[0].tipo = "texto";
  }
  const umDe = (v, ok, padrao) => (ok.includes(v) ? v : padrao);
  const telefone = typeof bruto?.cliente?.telefone === "string" ? bruto.cliente.telefone.replace(/\D/g, "") : "";
  const dias = Number.isFinite(bruto?.followup?.dias) ? Math.min(30, Math.max(0, Math.round(bruto.followup.dias))) : 1;
  return {
    cliente: {
      nome: limitar(bruto?.cliente?.nome, 60) || null,
      telefone: telefone.length >= 10 && telefone.length <= 13 ? telefone : null,
    },
    imovel_id: idsImoveis.has(bruto?.imovel_id) ? bruto.imovel_id : null,
    momento: umDe(bruto?.momento, ["primeiro_contato", "conversando", "sumiu", "pos_visita"], "conversando"),
    etapa: umDe(bruto?.etapa, ["novo", "conversando", "visita_marcada", "proposta", "vendido", "perdido"], "conversando"),
    temperatura: umDe(bruto?.temperatura, ["frio", "morno", "quente"], "morno"),
    leitura: limitar(bruto?.leitura, 300),
    respostas,
    proximo_passo: limitar(bruto?.proximo_passo, 160),
    followup: {
      precisa: bruto?.followup?.precisa !== false && bruto?.pediu_para_parar !== true,
      dias,
      hora: HORA_VALIDA.test(bruto?.followup?.hora) ? bruto.followup.hora : "10:00",
      quando: limitar(bruto?.followup?.quando, 80),
      mensagem: limitar(bruto?.followup?.mensagem, 1200),
    },
    por_que: limitar(bruto?.por_que, 300),
    resumo: limitar(bruto?.resumo, 240),
    primeira_mensagem: {
      data: /^\d{4}-\d{2}-\d{2}$/.test(bruto?.primeira_mensagem?.data) ? bruto.primeira_mensagem.data : null,
      hora: HORA_VALIDA.test(bruto?.primeira_mensagem?.hora) ? bruto.primeira_mensagem.hora : null,
    },
    pediu_para_parar: bruto?.pediu_para_parar === true,
    avaliacao: normalizarAvaliacao(bruto?.avaliacao),
  };
}

/** Avaliação do atendimento: só códigos conhecidos, para o painel nunca mostrar lixo. */
function normalizarAvaliacao(a) {
  if (!a || typeof a !== "object") return null;
  const umDe = (v, ok) => (ok.includes(v) ? v : null);
  const lista = (v, ok) => [...new Set((Array.isArray(v) ? v : []).filter((x) => ok.includes(x)))];
  const nota = Number.isFinite(a.nota_atendimento) ? Math.min(10, Math.max(0, Math.round(a.nota_atendimento))) : null;
  const minutos = Number.isFinite(a.minutos_ate_primeira_resposta) && a.minutos_ate_primeira_resposta >= 0
    ? Math.round(a.minutos_ate_primeira_resposta) : null;
  return {
    nota_atendimento: nota,
    minutos_ate_primeira_resposta: minutos,
    onde_travou: umDe(a.onde_travou, AVALIACAO.onde_travou),
    causa_principal: umDe(a.causa_principal, AVALIACAO.causa_principal) || "ainda_em_andamento",
    falhas: lista(a.falhas, AVALIACAO.falhas),
    acertos: lista(a.acertos, AVALIACAO.acertos),
    motivo_esfriou: umDe(a.motivo_esfriou, AVALIACAO.motivo_esfriou),
    comentario: limitar(a.comentario, 300),
  };
}

/** Lê o JSON de uma resposta em texto: puro, dentro de ```json```, ou do primeiro { ao último }. */
function lerJson(texto) {
  const t = String(texto ?? "").trim();
  const candidatos = [t];
  const cerca = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (cerca) candidatos.push(cerca[1]);
  const i = t.indexOf("{");
  const j = t.lastIndexOf("}");
  if (i >= 0 && j > i) candidatos.push(t.slice(i, j + 1));
  for (const c of candidatos) {
    try { return JSON.parse(c); } catch { /* tenta o próximo */ }
  }
  throw { code: "invalid_json", message: "a resposta não trouxe JSON" };
}

/** Pergunta ao Claude. Rejeita com {code} (os códigos do capability "sample", mais "sem_ia"). */
async function pensar(entrada, listaImoveis) {
  const sample = await window.claude?.use?.("sample");
  if (!sample) throw { code: "sem_ia" };
  const opcoes = { model: MODELO, modelTier: "default" };
  if (entrada.imagens?.length) opcoes.images = entrada.imagens.map((i) => i.blob);
  const pedido = montarPedido(entrada, listaImoveis);
  // Plano B para aplicativos do Claude mais antigos, que não têm sample.json:
  // pede a resposta em texto comum e lê o JSON aqui mesmo.
  const emTexto = async () => lerJson((await sample(pedido, opcoes)).text);
  let bruto;
  if (typeof sample.json !== "function") {
    bruto = await emTexto();
  } else {
    try {
      bruto = await sample.json(pedido, opcoes);
    } catch (erro) {
      if (erro?.code !== "capability_removed") throw erro;
      bruto = await emTexto();
    }
  }
  return normalizarResultado(bruto, new Set(listaImoveis.map((i) => i.id)));
}

// Copiloto de Vendas Schay — app que roda dentro do Claude (Artifact).
// Este arquivo e o gestor.js/cerebro.js são juntados num só <script> pelo scripts/montar.mjs.

// ---------------------------------------------------------------- 1. Utilidades
const CHAVES = {
  clientes: "copiloto.cache.clientes",
  imoveis: "copiloto.cache.imoveis",
  config: "copiloto.cache.config",
  sugestoes: "copiloto.sugestoes",
  passeio: "copiloto.passeioVisto",
};

const guardar = {
  ler(chave, padrao) {
    try {
      const v = localStorage.getItem(chave);
      return v === null ? padrao : JSON.parse(v);
    } catch {
      return padrao;
    }
  },
  gravar(chave, valor) {
    try { localStorage.setItem(chave, JSON.stringify(valor)); } catch { /* sem espaço ou bloqueado */ }
  },
};

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const iso = (d) => (d instanceof Date ? d : new Date(d)).toISOString();
const clonar = (o) => JSON.parse(JSON.stringify(o));
const DIA = 86_400_000;
const SEMANA = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];

function inicioDoDia(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  return x;
}
const diasEntre = (a, b) => Math.round((inicioDoDia(b) - inicioDoDia(a)) / DIA);

function horaTexto(d) {
  const h = d.getHours();
  const m = d.getMinutes();
  return m ? `${h}h${String(m).padStart(2, "0")}` : `${h}h`;
}

function diaTexto(d) {
  const dif = diasEntre(new Date(), d);
  if (dif === 0) return "hoje";
  if (dif === 1) return "amanhã";
  if (dif === -1) return "ontem";
  if (dif > 1 && dif < 7) return SEMANA[d.getDay()];
  return `dia ${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`;
}

const quandoTexto = (valor) => {
  const d = new Date(valor);
  return `${diaTexto(d)} às ${horaTexto(d)}`;
};

function haQuantoTempo(valor) {
  const min = Math.max(0, Math.round((Date.now() - Date.parse(valor)) / 60_000));
  if (min < 2) return "agora há pouco";
  if (min < 60) return `há ${min} minutos`;
  const h = Math.round(min / 60);
  if (h < 24) return h === 1 ? "há 1 hora" : `há ${h} horas`;
  const d = Math.round(h / 24);
  return d === 1 ? "há 1 dia" : `há ${d} dias`;
}

function saudacao() {
  const h = new Date().getHours();
  return h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
}

const soNumeros = (s) => String(s ?? "").replace(/\D/g, "");

function foneWhats(t) {
  let n = soNumeros(t);
  if (n.length === 10 || n.length === 11) n = `55${n}`;
  return n.length >= 12 && n.length <= 13 ? n : null;
}

function foneBonito(t) {
  let n = soNumeros(t);
  if (n.length > 11 && n.startsWith("55")) n = n.slice(2);
  if (n.length === 11) return `(${n.slice(0, 2)}) ${n.slice(2, 7)}-${n.slice(7)}`;
  if (n.length === 10) return `(${n.slice(0, 2)}) ${n.slice(2, 6)}-${n.slice(6)}`;
  return t || "";
}

const mesmoFone = (a, b) => {
  const x = soNumeros(a);
  const y = soNumeros(b);
  return x.length >= 8 && y.length >= 8 && x.slice(-8) === y.slice(-8);
};

const normNome = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();

function novoId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return `c-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
}

/** Mostra os dados de exemplo sem o aviso "EXEMPLO - SUBSTITUIR". */
const semExemplo = (s) => String(s ?? "").replace(/EXEMPLO - SUBSTITUIR:?\s*(·\s*)?/g, "").replace(/^\(ex\.:\s*(.*)\)$/, "$1").trim();

function linkWhats(telefone, texto) {
  const fone = foneWhats(telefone);
  if (fone) return `https://wa.me/${fone}`;
  return texto ? `https://wa.me/?text=${encodeURIComponent(texto)}` : "https://wa.me/";
}

/** Copia no próprio toque (antes de o link abrir o WhatsApp). */
function copiarTexto(texto) {
  let ok = false;
  try {
    const area = document.createElement("textarea");
    area.value = texto;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.top = "0";
    area.style.left = "-9999px";
    area.style.fontSize = "16px";
    document.body.appendChild(area);
    area.select();
    area.setSelectionRange(0, texto.length);
    ok = document.execCommand("copy");
    area.remove();
  } catch { /* tenta do outro jeito */ }
  try {
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(texto).catch(() => {});
      ok = true;
    }
  } catch { /* sem área de transferência */ }
  return ok;
}

let temporizadorAviso = null;
function esconderAviso() {
  clearTimeout(temporizadorAviso);
  document.getElementById("aviso").hidden = true;
}
function aviso(texto, ms = 3400) {
  const el = document.getElementById("aviso");
  el.textContent = texto;
  el.hidden = false;
  el.style.animation = "none";
  void el.offsetWidth;
  el.style.animation = "";
  clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(() => { el.hidden = true; }, ms);
}

function festa() {
  const caixa = document.createElement("div");
  caixa.className = "festa";
  caixa.setAttribute("aria-hidden", "true");
  const pecas = ["🎉", "✨", "🏠", "💛", "🎊", "⭐"];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement("span");
    s.textContent = pecas[i % pecas.length];
    s.style.left = `${Math.random() * 100}%`;
    s.style.animationDelay = `${Math.random() * 0.8}s`;
    s.style.fontSize = `${22 + Math.random() * 22}px`;
    caixa.appendChild(s);
  }
  document.body.appendChild(caixa);
  setTimeout(() => caixa.remove(), 3800);
}

// ---------------------------------------------------------------- 2. Dados
// Banco do Claude (capability "db"), compartilhado entre a Schay e o gestor.
// Uma cópia fica no aparelho só para abrir rápido. Sem banco, o app guarda só no aparelho.
let db = null;
let modoLocal = false;
let ehDono = false;
let dadosCarregados = false;
let clientes = guardar.ler(CHAVES.clientes, []);
if (!Array.isArray(clientes)) clientes = [];
let imoveis = guardar.ler(CHAVES.imoveis, []);
if (!Array.isArray(imoveis)) imoveis = [];
let config = guardar.ler(CHAVES.config, {}) || {};
const sugestoes = guardar.ler(CHAVES.sugestoes, {}) || {}; // sugestões de resposta: só neste aparelho
let redesenhoPendente = false;

const nomeCorretora = () => config.nomeCorretora || "Schay";
const acharPorId = (id) => clientes.find((c) => c.id === id) || null;
const imovelPorId = (id) => imoveis.find((i) => i.id === id) || null;
const nomeImovel = (id) => semExemplo(imovelPorId(id)?.titulo) || "";
const nomeDoCliente = (c) => c.nome || (c.telefone ? foneBonito(c.telefone) : "Cliente sem nome");
const inicial = (c) => (c.nome || "?").trim().charAt(0).toUpperCase() || "?";

const filas = new Map();
/** Grava um documento no banco, uma escrita por vez para o mesmo documento. */
function escrever(caminho, corpo) {
  if (!db || modoLocal) return Promise.resolve();
  const anterior = filas.get(caminho) || Promise.resolve();
  const proxima = anterior
    .then(() => db.doc(caminho).set(corpo))
    .catch(async (erro) => {
      if (erro?.code === "unavailable") {
        await new Promise((r) => setTimeout(r, 800 + Math.random() * 1200));
        return db.doc(caminho).set(corpo).catch(tratarErroEscrita);
      }
      return tratarErroEscrita(erro);
    });
  filas.set(caminho, proxima);
  return proxima;
}

function apagarDoc(caminho) {
  if (!db || modoLocal) return Promise.resolve();
  const anterior = filas.get(caminho) || Promise.resolve();
  const proxima = anterior.then(() => db.doc(caminho).delete()).catch(tratarErroEscrita);
  filas.set(caminho, proxima);
  return proxima;
}

function tratarErroEscrita(erro) {
  console.warn("Copiloto: não consegui gravar no banco", erro?.code, erro?.message);
  if (erro?.code === "quota_exceeded") aviso("O espaço do app acabou. Avise o seu gestor.", 6000);
  if (erro?.code === "invalid_argument" || erro?.code === "revoked" || erro?.code === "not_granted") {
    // Sem permissão para gravar (ex.: convite sem nível de Editor): continua só neste aparelho.
    modoLocal = true;
    if (telaAtual().nome === "gestor") desenhar();
  }
}

function salvarCliente(c) {
  c.atualizadoEm = iso(new Date());
  if (!acharPorId(c.id)) clientes.push(c);
  guardar.gravar(CHAVES.clientes, clientes);
  escrever(`clientes/${c.id}`, clonar(c));
}

function apagarCliente(id) {
  clientes = clientes.filter((c) => c.id !== id);
  guardar.gravar(CHAVES.clientes, clientes);
  delete sugestoes[id];
  guardar.gravar(CHAVES.sugestoes, sugestoes);
  return apagarDoc(`clientes/${id}`);
}

function guardarSugestao(id, valor) {
  if (valor) sugestoes[id] = valor;
  else delete sugestoes[id];
  guardar.gravar(CHAVES.sugestoes, sugestoes);
}

/** Atualiza a tela quando chegam dados novos, sem atrapalhar quem está digitando. */
function dadosMudaram() {
  const nome = telaAtual().nome;
  if (!["inicio", "chamar", "clientes", "cliente", "gestor", "imovel"].includes(nome)) return;
  const ativo = document.activeElement;
  const digitando = ativo && ["INPUT", "TEXTAREA", "SELECT"].includes(ativo.tagName);
  if (digitando || app.querySelector("details[open], [data-editando]")) {
    redesenhoPendente = true;
    return;
  }
  desenhar();
}

function assinarBanco() {
  db.collection("clientes").onSnapshot(
    (snap) => {
      clientes = snap.docs.map((d) => ({ ...clonar(d.data()), id: d.id }));
      if (!snap.metadata.fromCache) dadosCarregados = true;
      guardar.gravar(CHAVES.clientes, clientes);
      dadosMudaram();
    },
    (erro) => console.warn("Copiloto: clientes", erro?.code),
  );
  db.collection("imoveis").onSnapshot(
    (snap) => {
      imoveis = snap.docs.map((d) => ({ ...clonar(d.data()), id: d.id })).sort((a, b) => String(a.titulo).localeCompare(String(b.titulo), "pt-BR"));
      guardar.gravar(CHAVES.imoveis, imoveis);
      dadosMudaram();
    },
    (erro) => console.warn("Copiloto: imóveis", erro?.code),
  );
  db.doc("config/geral").onSnapshot(
    (snap) => {
      config = snap.exists ? clonar(snap.data()) : {};
      guardar.gravar(CHAVES.config, config);
      dadosMudaram();
    },
    (erro) => console.warn("Copiloto: config", erro?.code),
  );
}

// ---------------------------------------------------------------- 3. Regras de cada cliente
const ORDEM = ["novo", "conversando", "visita_marcada", "proposta"];
const ESTADOS = {
  novo: "Novo",
  conversando: "Conversando",
  visita_marcada: "Visita marcada",
  proposta: "Fez proposta",
  vendido: "Comprou 🎉",
  perdido: "Desistiu",
};
const INTERVALO_RETOMADA = { 1: 2, 2: 4, 3: 7 }; // D+1 → D+3 → D+7 → D+14

function mudarEtapa(c, etapa, quando = new Date()) {
  if (c.etapa === etapa) return;
  c.etapa = etapa;
  c.historico = c.historico || [];
  c.historico.push({ tipo: `etapa:${etapa}`, em: iso(quando) });
  if (c.historico.length > 80) c.historico = c.historico.slice(-80);
}

function avancarEtapa(c, alvo, quando) {
  if (alvo === "perdido") return mudarEtapa(c, "perdido", quando);
  if (c.etapa === "vendido") return;
  if (alvo === "vendido") alvo = "proposta"; // venda só com o botão "Comprou"
  const destino = Math.max(0, ORDEM.indexOf(alvo));
  if (c.etapa === "perdido") {
    c.motivoPerda = null;
    c.historico.push({ tipo: "voltou", em: iso(quando) });
    c.etapa = "novo";
    for (let i = 1; i <= Math.max(1, destino); i++) mudarEtapa(c, ORDEM[i], quando);
    return;
  }
  for (let i = ORDEM.indexOf(c.etapa) + 1; i <= destino; i++) mudarEtapa(c, ORDEM[i], quando);
}

function dataLembrete(dias, hora = "10:00") {
  const [h, m] = String(hora).split(":").map(Number);
  const d = new Date();
  d.setDate(d.getDate() + (Number.isFinite(dias) ? dias : 1));
  d.setHours(Number.isFinite(h) ? h : 10, Number.isFinite(m) ? m : 0, 0, 0);
  if (d.getTime() < Date.now() + 45 * 60_000) d.setDate(d.getDate() + 1);
  return d;
}

function acharCliente({ nome, telefone }) {
  if (telefone) {
    const porFone = clientes.find((c) => c.telefone && mesmoFone(c.telefone, telefone));
    if (porFone) return porFone;
  }
  const n = normNome(nome);
  if (n.length >= 2) {
    return clientes.find((c) => normNome(c.nome) === n && !(c.telefone && telefone && !mesmoFone(c.telefone, telefone))) || null;
  }
  return null;
}

/** Cria ou atualiza o cliente com o que a IA leu da conversa. Salvar é automático. */
function registrarConversa(f, r) {
  const agora = new Date();
  let c = (f.clienteId && acharPorId(f.clienteId)) || acharCliente(r.cliente);
  if (!c) {
    // Data e hora da 1ª mensagem do cliente, lidas no print (vale para leads antigos também).
    let primeiro = agora;
    const pm = r.primeira_mensagem || {};
    if (pm.data || pm.hora) {
      const d = pm.data ? new Date(`${pm.data}T12:00:00`) : new Date();
      if (pm.hora) {
        const [h, m] = pm.hora.split(":").map(Number);
        d.setHours(h, m, 0, 0);
      }
      if (!Number.isNaN(d.getTime()) && d <= agora && agora - d < 400 * DIA) primeiro = d;
    }
    c = {
      id: novoId(),
      nome: "",
      telefone: null,
      imovelId: null,
      etapa: "novo",
      motivoPerda: null,
      temperatura: null,
      resumo: "",
      anotacoes: "",
      criadoEm: iso(agora),
      primeiroContato: iso(primeiro),
      primeiraRespostaEm: null,
      medirResposta: r.momento === "primeiro_contato",
      ultimaInteracao: null,
      aguardandoDesde: null,
      proximoFollowup: null,
      followupMotivo: null,
      followupMensagem: "",
      tentativas: 0,
      visitaEm: null,
      momentoUltimo: null,
      historico: [{ tipo: "chegou", em: iso(primeiro) }],
    };
  }
  if (!c.nome && r.cliente.nome) c.nome = r.cliente.nome;
  if (!c.telefone && r.cliente.telefone) c.telefone = r.cliente.telefone;
  c.imovelId = r.imovel_id || f.imovelId || c.imovelId;
  c.temperatura = r.temperatura;
  if (r.resumo) c.resumo = r.resumo;
  avancarEtapa(c, r.etapa, agora);
  if (c.etapa === "perdido") c.motivoPerda = r.pediu_para_parar ? "Pediu para não ser chamado" : c.motivoPerda || "Desistiu na conversa";
  c.ultimaInteracao = iso(agora);
  c.aguardandoDesde = c.etapa === "perdido" ? null : c.aguardandoDesde || iso(agora);
  c.momentoUltimo = r.momento;
  if (r.avaliacao) c.avaliacao = { ...r.avaliacao, em: iso(agora) }; // só aparece no painel do gestor
  if (r.followup.precisa && c.etapa !== "perdido") {
    // Chamar de novo só a partir do dia seguinte: no mesmo dia ainda é conversa, não acompanhamento.
    c.proximoFollowup = iso(dataLembrete(Math.max(1, r.followup.dias), r.followup.hora));
    c.followupMotivo = "retomar";
    c.followupMensagem = r.followup.mensagem;
  } else {
    c.proximoFollowup = null;
    c.followupMotivo = null;
    c.followupMensagem = "";
  }
  guardarSugestao(c.id, { principal: r.respostas[0], alternativa: r.respostas[1] || null, em: iso(agora) });
  salvarCliente(c);
  return c;
}

/** Ela mandou a mensagem para o cliente (copiou ou tocou em "Já chamei"). */
function registrarEnvio(c, agora = new Date()) {
  c.ultimaInteracao = iso(agora);
  c.aguardandoDesde = null;
  if (!c.primeiraRespostaEm) c.primeiraRespostaEm = iso(agora);
  c.historico = c.historico || [];
  c.historico.push({ tipo: "enviou", em: iso(agora) });
  if (c.historico.length > 80) c.historico = c.historico.slice(-80);
}

/** Por que esse cliente está na lista de hoje (ou null se não está).
 *  "Quem chamar hoje" é só acompanhamento: quem esfriou e chegou no dia de ser chamado de novo
 *  (e o pós-visita). Cliente que acabou de receber resposta não entra aqui. */
function motivoParaChamar(c) {
  if (c.etapa === "vendido" || c.etapa === "perdido") return null;
  if (c.proximoFollowup) {
    const quando = Date.parse(c.proximoFollowup);
    const fimDeHoje = inicioDoDia(new Date()).getTime() + DIA;
    if (quando < fimDeHoje) return { tipo: c.followupMotivo === "pos_visita" ? "visita" : "retomar", ordem: 1e13 + quando };
  }
  return null;
}

const listaDeHoje = () =>
  clientes
    .map((c) => ({ c, m: motivoParaChamar(c) }))
    .filter((x) => x.m)
    .sort((a, b) => a.m.ordem - b.m.ordem);

function contextoParaIA(c, comRetomada) {
  if (!c) return null;
  const visita = c.visitaEm ? new Date(c.visitaEm) : null;
  return {
    nome: c.nome || null,
    resumo: c.resumo || null,
    etapa: c.etapa,
    temperatura: c.temperatura,
    diasSemContato: c.ultimaInteracao ? diasEntre(new Date(c.ultimaInteracao), new Date()) : null,
    tentativas: c.tentativas || 0,
    motivo: comRetomada ? (c.followupMotivo === "pos_visita" ? "pos_visita" : "retomar") : null,
    visitaEm: visita ? `${diaTexto(visita)} às ${horaTexto(visita)}` : null,
    mensagemPlanejada: comRetomada ? c.followupMensagem || null : null,
  };
}

// Reduz no próprio celular (~1500 px) e manda ao Claude. A imagem não é guardada.
function carregarImagem(arquivo) {
  return new Promise((ok, falha) => {
    const url = URL.createObjectURL(arquivo);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); ok(img); };
    img.onerror = () => { URL.revokeObjectURL(url); falha(new Error("imagem")); };
    img.src = url;
  });
}

async function desenharReduzido(arquivo, maior) {
  let fonte;
  let largura;
  let altura;
  try {
    fonte = await createImageBitmap(arquivo, { imageOrientation: "from-image" });
    largura = fonte.width;
    altura = fonte.height;
  } catch {
    fonte = await carregarImagem(arquivo);
    largura = fonte.naturalWidth;
    altura = fonte.naturalHeight;
  }
  const escala = Math.min(1, maior / Math.max(largura, altura));
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(largura * escala));
  canvas.height = Math.max(1, Math.round(altura * escala));
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(fonte, 0, 0, canvas.width, canvas.height);
  fonte.close?.();
  return canvas;
}

async function prepararPrint(arquivo) {
  const canvas = await desenharReduzido(arquivo, 1500);
  const blob = await new Promise((ok) => canvas.toBlob(ok, "image/jpeg", 0.85));
  if (!blob) throw new Error("imagem");
  return { blob, previa: canvas.toDataURL("image/jpeg", 0.5) };
}

function ir(nome, params = {}) {
  pilha.push({ nome, params });
  desenhar(true);
}
function trocar(nome, params = {}) {
  pilha[pilha.length - 1] = { nome, params };
  desenhar(true);
}
function voltar() {
  if (pilha.length > 1) pilha.pop();
  desenhar(true);
}
function irInicio() {
  pilha = [{ nome: "inicio", params: {} }];

}

let pararFrases = null;
function desenhar(rolarParaCima = false) {
  redesenhoPendente = false;
  if (pararFrases) { pararFrases(); pararFrases = null; }
  const { nome, params } = telaAtual();
  const tela = TELAS[nome] || TELAS.inicio;
  app.classList.toggle("largo", nome === "gestor");
  app.innerHTML = tela(params) + (passeio !== null ? telaPasseio() : "");
  if (rolarParaCima) window.scrollTo(0, 0);
  const frase = app.querySelector("[data-frases]");
  if (frase) pararFrases = girarFrases(frase);
  const foco = app.querySelector("[data-foco]");
  if (foco) foco.focus({ preventScroll: true });
}

function girarFrases(el) {
  const frases = el.dataset.frases.split("|");
  let i = 0;
  const id = setInterval(() => {
    i = (i + 1) % frases.length;
    el.textContent = frases[i];
  }, 3200);
  return () => clearInterval(id);
}

        <button class="botao forte gigante" type="button" data-acao="escolher-foto" data-foco><span class="emoji" aria-hidden="true">📷</span>Toque aqui para escolher a foto</button>

  // ---------- Passo 2 ----------
  imovel() {
    if (!fluxo) return TELAS.inicio();
    const previas = fluxo.imagens.length
      ? `<div class="fotos-escolhidas">${fluxo.imagens.map((i) => `<img src="${i.previa}" alt="">`).join("")}<span>✓ ${fluxo.imagens.length === 1 ? "Foto recebida" : `${fluxo.imagens.length} fotos recebidas`}</span></div>`
      : `<div class="fotos-escolhidas"><span>✓ Conversa recebida</span></div>`;
    const cards = imoveis.map((i) => {
      const detalhes = [semExemplo(i.bairro), semExemplo(i.preco)].filter(Boolean).join(" · ");
      const foto = typeof i.foto === "string" && i.foto.startsWith("data:image/") ? i.foto : "";
      return `<button class="imovel" type="button" data-acao="escolher-imovel" data-id="${esc(i.id)}">
        ${foto ? `<img src="${esc(foto)}" alt="">` : `<span class="icone-pular" aria-hidden="true">🏠</span>`}
        <span>${i.exemplo ? `<span class="etiqueta">EXEMPLO</span>` : ""}<strong>${esc(semExemplo(i.titulo))}</strong><span>${esc(detalhes)}</span></span>
      </button>`;
    }).join("");
    return `<section class="tela">${barra({ passo: 2 })}
      <div class="conteudo">
        <div class="titulo"><h1>Sobre qual imóvel ele perguntou?</h1><p>Toque no imóvel. Se não souber, toque em “Não sei”.</p></div>
        ${previas}
        <div class="lista-imoveis">${cards}
          <button class="imovel pular" type="button" data-acao="escolher-imovel" data-id="">
            <span class="icone-pular" aria-hidden="true">🤷</span>
            <span><strong>Não sei / pular</strong><span>O app tenta descobrir pela conversa</span></span>
          </button>
        </div>
      </div></section>`;
  },

  // ---------- Passo 3 ----------
  resultado() {
    if (!fluxo) return TELAS.inicio();
    if (fluxo.carregando) return telaPensando();
    if (fluxo.erro) return telaOps(fluxo.erro, "tentar-de-novo", 3);
    const r = fluxo.resultado;
    if (!r) return TELAS.inicio();
    const c = acharPorId(fluxo.clienteId);
    const [emoji, palavra] = SELOS[r.temperatura] || SELOS.morno;
    const outra = r.respostas[1];
    const objetivo = r.proximo_passo ? `<p class="objetivo">🎯 Seu objetivo agora: <b>${esc(r.proximo_passo)}</b></p>` : "";
    const lembrete = c?.proximoFollowup
      ? `<div class="cartao lembrete"><span class="emoji" aria-hidden="true">⏰</span><div>
          <strong>Se ele não responder:</strong><p>chamar de novo ${esc(quandoTexto(c.proximoFollowup))}</p>
          ${objetivo}<span class="ok-verde">✓ Lembrete criado</span></div></div>`
      : objetivo;
    const pedirNome = c && !c.nome
      ? `<div class="cartao pilha"><h2>Qual o nome desse cliente?</h2><p class="objetivo">Para eu te lembrar dele depois.</p>
          <label class="escondido" for="nome-cliente">Nome do cliente</label>
          <input id="nome-cliente" class="campo" type="text" autocomplete="off" autocapitalize="words" placeholder="Toque aqui e escreva o nome">
          <button class="botao claro" type="button" data-acao="guardar-nome">Guardar o nome</button></div>`
      : "";
    return `<section class="tela">${barra({ passo: 3 })}
      <div class="conteudo">
        <div class="selo ${esc(r.temperatura)}"><span class="emoji" aria-hidden="true">${emoji}</span>
          <div><strong>Cliente ${palavra}</strong><p>${esc(r.leitura)}</p></div></div>
        <div class="responda"><h2>Responda assim:</h2>${blocoResposta(r.respostas[0], c?.telefone, 0, "fluxo")}</div>
        ${outra ? (fluxo.mostrarOutra
          ? `<div class="responda"><h2>Outra opção:</h2>${blocoResposta(outra, c?.telefone, 1, "fluxo")}</div>`
          : `<button class="link" type="button" data-acao="outra-opcao">Quero outra opção de resposta</button>`) : ""}
        ${pedirNome}
        ${lembrete}
        ${r.por_que ? `<div class="dica"><strong>💡 Dica</strong><p>${esc(r.por_que)}</p></div>` : ""}
        <button class="botao claro" type="button" data-acao="inicio">Voltar ao início</button>
      </div></section>`;
  },

  // ---------- Quem chamar hoje ----------
  chamar() {
    const lista = listaDeHoje();
    if (!lista.length) {
      return `<section class="tela">${barra()}
        <div class="conteudo"><div class="vazio"><div class="emoji" aria-hidden="true">🎉</div><h1>Tudo em dia!</h1><p>Ninguém para chamar de novo hoje. Quando um cliente mandar mensagem, toque em “Responder um cliente”.</p></div>

        </div></section>`;
    }
    const cards = lista.map(({ c, m }) => {
      let situacao;
      if (m.tipo === "esperando") situacao = `<p class="situacao urgente">⏳ Esperando sua resposta ${esc(haQuantoTempo(c.aguardandoDesde))}</p>`;
      else if (m.tipo === "visita") situacao = `<p class="situacao visita">🏠 Teve visita: pergunte o que ele achou</p>`;

    if (retomada.carregando) return telaPensando("Preparando a mensagem…", 0);

// ---------------------------------------------------------------- 8. O que cada botão faz
function novoFluxo(clienteId = null) {
  fluxo = { clienteId, imagens: [], texto: "", modoTexto: false, imovelId: null, escolha: 0, resultado: null, erro: null, carregando: false, mostrarOutra: false, copiou: false };
}

function abrirSeletorFoto() {
  const input = document.getElementById("seletor-foto");
  input.value = "";
  input.click();
}

function pedirIA(f) {
  const c = f.clienteId ? acharPorId(f.clienteId) : null;
  const entrada = {
    modo: "conversa",
    imagens: f.imagens,
    texto: f.texto,
    imovelId: f.imovelId || c?.imovelId || null,
    cliente: contextoParaIA(c, false),
  };
  return pensar(entrada, imoveis).then(
    (resultado) => ({ resultado }),
    (erro) => {
      console.warn("Copiloto: IA", erro?.code, erro?.message, erro);
      return { erro: erro?.code || (erro instanceof Error ? `js:${erro.name}` : "upstream_error") };
    },
  );
}

function conversaPronta() {
  if (imoveis.length) ir("imovel");
  else escolherImovel("");
}

async function escolherImovel(id) {
  const f = fluxo;
  const minha = ++f.escolha;
  f.imovelId = id || null;
  f.carregando = true;
  f.erro = null;
  f.resultado = null;
  f.mostrarOutra = false;
  f.copiou = false;
  if (telaAtual().nome === "resultado") desenhar(true);
  else ir("resultado");
  const r = await pedirIA(f);
  if (f !== fluxo || minha !== f.escolha) return;
  f.carregando = false;
  if (r.erro) f.erro = r.erro;
  else {
    f.resultado = r.resultado;
    const c = registrarConversa(f, r.resultado);
    f.clienteId = c.id;
    setTimeout(() => aviso("Cliente salvo ✓"), 400);
  }
  if (telaAtual().nome === "resultado") desenhar(true);
}

async function abrirRetomada(id) {
  const c = acharPorId(id);
  if (!c) return;
  const m = motivoParaChamar(c);
  const guardada = sugestoes[id];
  if (m?.tipo === "esperando" && guardada?.principal) {
    // A resposta já foi pensada neste aparelho: mostra na hora, sem gastar de novo.
    retomada = { clienteId: id, carregando: false, erro: null, mostrarOutra: false, copiou: false,
      resultado: { respostas: [guardada.principal, guardada.alternativa].filter(Boolean), por_que: "", followup: null } };
    return ir("retomar", { id });
  }
  if (m?.tipo === "esperando") {
    novoFluxo(id);
    ir("foto");
    abrirSeletorFoto();
    return;
  }

async function pedirRetomada() {
  const atual = retomada;
  const c = acharPorId(atual.clienteId);
  atual.carregando = true;
  atual.erro = null;
  if (telaAtual().nome === "retomar") desenhar();
  try {
    atual.resultado = await pensar({ modo: "retomar", imovelId: c.imovelId, cliente: contextoParaIA(c, true) }, imoveis);
  } catch (erro) {
    console.warn("Copiloto: IA", erro?.code, erro?.message, erro);
    atual.erro = erro?.code || (erro instanceof Error ? `js:${erro.name}` : "upstream_error");
  }
  atual.carregando = false;
  if (retomada === atual && telaAtual().nome === "retomar") desenhar();
}

function jaChamei() {
  const c = acharPorId(retomada?.clienteId);
  if (!c) return voltar();
  const m = motivoParaChamar(c);
  const agora = new Date();
  const hora = retomada.resultado?.followup?.hora || "10:00";
  registrarEnvio(c, agora);
  let mensagem = "Feito ✓";
  if (m?.tipo === "esperando") {
    mensagem = c.proximoFollowup ? `Feito ✓ Se ele não responder, te lembro ${quandoTexto(c.proximoFollowup)}` : "Feito ✓";
  } else if (m?.tipo === "visita") {
    c.followupMotivo = "retomar";
    c.tentativas = 0;
    c.proximoFollowup = iso(dataLembrete(1, hora));
    c.followupMensagem = retomada.resultado?.followup?.mensagem || "";
    mensagem = `Feito ✓ Se ele não responder, te lembro ${quandoTexto(c.proximoFollowup)}`;
  } else {
    c.tentativas = (c.tentativas || 0) + 1;
    if (c.tentativas >= 4) {
      c.proximoFollowup = null;
      c.motivoPerda = "Parou de responder";
      mudarEtapa(c, "perdido", agora);
      mensagem = "Feito ✓ Ele saiu da sua lista. Se voltar a falar, é só mandar a foto da conversa.";
    } else {
      c.proximoFollowup = iso(dataLembrete(INTERVALO_RETOMADA[c.tentativas], hora));
      c.followupMotivo = "retomar";
      c.followupMensagem = retomada.resultado?.followup?.mensagem || "";
      mensagem = `Feito ✓ Vou te lembrar de novo ${quandoTexto(c.proximoFollowup)}`;
    }
  }
  guardarSugestao(c.id, null);
  salvarCliente(c);
  aviso(mensagem, 4200);
  retomada = null;
  voltar();
}
