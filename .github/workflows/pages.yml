# Publica a porta de entrada (pasta entrada/) no GitHub Pages a cada envio para a main.
# Endereço: https://theusmkt.github.io/CO-PILOTO/
name: Publicar a porta de entrada

on:
  push:
    branches: [main]
    paths: ["entrada/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: entrada

      - id: deployment
        uses: actions/deploy-pages@v4
